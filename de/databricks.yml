# This is a Declarative Automation Bundle definition for de.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: de
  uuid: 7d0d978d-9339-4e4e-a08f-9aea84cbaf12

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-f65a9d7f-b362.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-f65a9d7f-b362.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/shekhawatrupendra1@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shekhawatrupendra1@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: shekhawatrupendra1@gmail.com
        level: CAN_MANAGE
